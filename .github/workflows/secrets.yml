name: Secret scan

on: [push, pull_request]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$asset" -o "$RUNNER_TEMP/$asset"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          awk -v asset="$asset" '$2 == asset {print}' checksums.txt | sha256sum --check --strict
          tar -xzf "$asset" gitleaks
      - name: Scan complete repository history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all .'
