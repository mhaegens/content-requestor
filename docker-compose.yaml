services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TMDB_READ_TOKEN
      - ADMIN_API_KEY
      - JELLYFIN_URL
      - JELLYFIN_API_KEY
      - RADARR_URL
      - RADARR_API_KEY
      - RADARR_QUALITY_PROFILE_ID
      - RADARR_ROOT_FOLDER
      - SONARR_URL
      - SONARR_API_KEY
      - SONARR_QUALITY_PROFILE_ID
      - SONARR_ROOT_FOLDER
    volumes:
      - requestr-data:/app/data
    expose:
      - "3000"
    networks:
      - coolify
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.requestr.rule=Host(`requests.haegens.be`)
      - traefik.http.routers.requestr.entryPoints=http
      - traefik.http.routers.requestr.service=requestr
      - traefik.http.routers.requestr.priority=10
      - traefik.http.services.requestr.loadbalancer.server.port=3000

volumes:
  requestr-data:

networks:
  coolify:
    external: true
