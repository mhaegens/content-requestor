services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TMDB_READ_TOKEN
    volumes:
      - requestr-data:/app/data
    expose:
      - "3000"
    networks:
      - coolify
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.requestr.rule=Host(`requests.haegens.be`)
      - traefik.http.routers.requestr.entryPoints=http
      - traefik.http.routers.requestr.service=requestr
      - traefik.http.services.requestr.loadbalancer.server.port=3000
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.routers.requestr.middlewares=gzip

volumes:
  requestr-data:

networks:
  coolify:
    external: true
